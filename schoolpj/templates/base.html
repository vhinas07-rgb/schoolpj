{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}
        دوره‌های آموزشی
      {% endblock %}
    </title>

    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: Tahoma, sans-serif;
        background-color: #f2f5fa;
        margin: 0;
        color: #333;
      }
      
      header {
        position: relative;
        background-color: #b8d9f5;
        color: white;
        text-align: center;
        padding: 25px;
      }
      
      header h1 {
        margin-top: 0;
      }
      .site-logo {
        position: absolute;
        top: 50%;
        left: 20px;
        transform: translateY(-50%);
        width: 100px;
        height: 100px;
        object-fit: contain;
      }
      
      .container {
        width: 85%;
        margin: 30px auto;
      }
      
      .categories {
        background-color: white;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
      }
      
      .categories a {
        color: #2457a7;
        text-decoration: none;
        margin: 10px;
      }
      
      .course {
        background-color: white;
        padding: 20px;
        margin-bottom: 15px;
        border-radius: 8px;
      }
      .course img {
        width: 100%;
        max-width: 300px;
        height: 180px;
        object-fit: cover;
        display: block;
        margin-bottom: 15px;
        border-radius: 8px;
      }
      .course a {
        display: inline-block;
        background-color: #2457a7;
        color: white;
        padding: 10px 15px;
        text-decoration: none;
        border-radius: 5px;
      }
      nav {
        background-color: #183f7a;
        padding: 12px 20px;
        display: flex;
        justify-content: center;
        gap: 25px;
        flex-wrap: wrap;
      }
      
      nav a {
        color: white;
        text-decoration: none;
      }
      
      nav a:hover {
        color: #c9dcff;
      }
      
      main {
        min-height: 60vh;
      }
      footer {
        text-align: center;
        padding: 30px 20px;
        color: #666;
      }
      
      footer form {
        max-width: 500px;
        margin: 15px auto 30px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        background-color: white;
        padding: 24px;
        border-radius: 8px;
      }
      
      footer input,
      footer textarea {
        padding: 10px 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-family: inherit;
        font-size: 1rem;
        width: 100%;
      }
      
      footer textarea {
        min-height: 110px;
        resize: vertical;
      }
      
      footer button {
        padding: 10px;
        background-color: #2457a7;
        color: white;
        border: none;
        border-radius: 6px;
        font-family: inherit;
        font-size: 1rem;
        cursor: pointer;
      }
      
      footer button:hover {
        background-color: #183f7a;
      }
      .course a {
        margin-left: 8px;
      }
    </style>
  </head>

  <body>
    <header>
      <img src="{% static 'img/logo/Logo.png' %}" alt="لوگوی آموزش‌یار" class="site-logo" />

      <h1>سامانه دوره‌های آموزشی</h1>
      <p>یادگیری مهارت‌های جدید برای آینده‌ای بهتر</p>
    </header>

    <div class="container">
      {% block content %}

      {% endblock %}
    </div>

    <footer>
      <h3>تماس با ما</h3>
      <form method="post" action="{% url 'contact' %}">
        {% csrf_token %}

        <input type="text" name="name" placeholder="نام شما" required />

        <input type="email" name="email" placeholder="ایمیل شما" required />

        <input type="text" name="subject" placeholder="موضوع پیام" required />

        <textarea name="message" placeholder="پیام شما" required></textarea>

        <button type="submit">ارسال پیام</button>
      </form>
    </footer>
  </body>
</html>
